[project]
name = "mas"
version = "0.1.0"
description = "Multi-Agent Research System — LangGraph pipeline for structured, cited research reports"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=0.2.0",
    "tavily-python>=0.5.0",
    "langsmith>=0.7.23",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "anthropic>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
