# Deploys the app to Google Cloud Run on every push to main, after the tests pass.
# It signs in to Google Cloud with Workload Identity Federation: GitHub gives the job
# a short-lived token, and Google accepts it only from this repository's main branch.
# No key file is stored anywhere. The deploy job is skipped until the repository
# variables below are set.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the token that Google checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The same settings as the first deploy by hand, which also made the app public.
      # The keys come from Secret Manager.
      - name: Deploy to Cloud Run
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: >-
          gcloud run deploy mas-demo
          --source .
          --project "$PROJECT"
          --region europe-north1
          --service-account "mas-demo-run@$PROJECT.iam.gserviceaccount.com"
          --set-secrets "ANTHROPIC_API_KEY=anthropic-api-key:latest,TAVILY_API_KEY=tavily-api-key:latest,LIVE_RUN_CODE=live-run-code:latest"
          --min-instances 0
          --max-instances 1
          --cpu 1
          --memory 1Gi
          --timeout 3600
          --quiet
