# Unit tests, and a check that the published numbers still rebuild from the saved runs.
# No secrets and no API calls, so it is safe to run on pull requests from forks.
name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.1"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Unit tests
        run: uv run pytest

      - name: The published numbers rebuild from the saved runs
        run: |
          uv run python -m injection.analyze
          uv run python -m calibration.analyze
          uv run python compare_researchers.py --summary
          git diff --exit-code -- injection/results.json calibration/results.json results/researcher_comparison/summary.json
